name: Build and Release Android APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Aethery APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standalone Release APKs
        run: |
          ./gradlew :app:assembleStandaloneRelease --info

      - name: Prepare and Rename APKs
        run: |
          mkdir -p dist
          # Copy compiled standalone release APKs into dist folder
          find app/build/outputs/apk/standalone/release/ -name "*.apk" -exec cp {} dist/ \;
          ls -la dist/

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
