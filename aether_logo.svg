<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A1829" />
      <stop offset="60%" stop-color="#0E0C15" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Glowing Blue Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6200EE" />
      <stop offset="50%" stop-color="#3700B3" />
      <stop offset="100%" stop-color="#03DAC6" />
    </linearGradient>

    <!-- Light Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#03DAC6" />
      <stop offset="100%" stop-color="#6200EE" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Pulse Circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6200EE" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.25" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#03DAC6" stroke-width="1" opacity="0.15" />

  <!-- Globe Net Grid (Perspective Tunnel) -->
  <g opacity="0.3">
    <!-- Latitudes -->
    <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="#6200EE" stroke-width="1" />
    <ellipse cx="256" cy="256" rx="160" ry="110" fill="none" stroke="#6200EE" stroke-width="1" />
    <ellipse cx="256" cy="256" rx="160" ry="15" fill="none" stroke="#6200EE" stroke-width="1" />
    <!-- Longitudes -->
    <path d="M 256,96 A 160,160 0 0,0 256,416" fill="none" stroke="#6200EE" stroke-width="1" />
    <path d="M 256,96 A 210,160 0 0,0 256,416" fill="none" stroke="#6200EE" stroke-width="1" />
    <path d="M 256,96 A 110,160 0 0,0 256,416" fill="none" stroke="#6200EE" stroke-width="1" />
  </g>

  <!-- Stylized A (Tunnel Core) -->
  <!-- Outer Glow of A -->
  <path d="M 256,120 L 360,340 L 310,340 L 256,220 L 202,340 L 152,340 Z" fill="url(#primaryGrad)" filter="url(#glow)" opacity="0.4" />
  
  <!-- Solid Sharp A -->
  <path d="M 256,120 L 360,340 L 310,340 L 256,220 L 202,340 L 152,340 Z" fill="url(#primaryGrad)" />

  <!-- The Horizontal Crossbar (Stylized Connection Bridge) -->
  <path d="M 190,290 L 322,290 L 302,315 L 210,315 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  <path d="M 190,290 L 322,290 L 302,315 L 210,315 Z" fill="url(#accentGrad)" />

  <!-- Inner Gateway Node -->
  <circle cx="256" cy="220" r="10" fill="#FFFFFF" filter="url(#glow)" />
</svg>
